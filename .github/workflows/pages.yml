name: Deploy Lasso to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['lasso/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the prompt engine
        run: node --test lasso/engine.test.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r lasso/. _site/
          rm -f _site/engine.test.js _site/README.md
          mkdir _site/skills
          cp -r docs/. _site/skills/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
